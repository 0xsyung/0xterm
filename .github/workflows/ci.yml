name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24 (not 20): jsdom@30 + @testing-library/jest-dom require Node >=22.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Coverage gate is enforced by vitest.config.ts thresholds (#6) —
      # a below-gate run makes test:coverage exit non-zero and fails this job.
      - run: npm run test:coverage
